name: Sealed product feed

# Rebuilds sealed-products.json from Cardmarket's daily price guide.
# Cardmarket updates its price guide once a day; this runs a few hours later.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build feed
        run: node build-sealed-feed.mjs sealed-products.json
        env:
          # Links products to pokemontcgapi.com ids (for photos in the app) via the Binder API.
          BINDER_API_TOKEN: ${{ secrets.BINDER_API_TOKEN }}

      - name: Commit if changed
        run: |
          git add sealed-products.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update sealed product feed"
          git push
